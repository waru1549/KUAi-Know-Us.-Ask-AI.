name: Backend CI

# Runs on pull requests and on pushes to feature branches.
# Pushes to main are checked by the "Deploy" workflow, which calls this file before deploying.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/backend-ci.yml'

  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (same version as production)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test
