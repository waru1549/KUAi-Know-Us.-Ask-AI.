name: Frontend CI

# Runs on pull requests and on pushes to feature branches.
# Pushes to main are checked by the "Deploy" workflow, which calls this file before deploying.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'

  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (same version as production)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Tests
        run: npm run test

      - name: Build Production App
        run: npm run build
