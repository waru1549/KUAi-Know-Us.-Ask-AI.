name: Deploy

# Continuous Deployment: every push to main is tested first,
# and only if every check passes is production updated.
#
#   push to main ──► Frontend CI ─┐
#                ──► Backend CI  ─┴─► deploy backend (Render) ─► deploy frontend (Vercel) ─► smoke test
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   RENDER_DEPLOY_HOOK_URL   Render → service → Settings → Deploy Hook
#   VERCEL_DEPLOY_HOOK_URL   Vercel → project → Settings → Git → Deploy Hooks (branch: main)
# Optional repository variables (… → Variables):
#   BACKEND_URL   default https://kuai-know-us-ask-ai.onrender.com
#   FRONTEND_URL  default https://team-portfolio-ai.vercel.app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://kuai-know-us-ask-ai.onrender.com' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://team-portfolio-ai.vercel.app' }}

jobs:
  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  deploy-backend:
    name: Deploy Backend (Render)
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set. See README → CI/CD."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered for commit $GITHUB_SHA"

      - name: Wait for the backend to be healthy
        run: |
          # Render builds in about 1–3 minutes; give it time, then poll the health endpoint.
          sleep 60
          for attempt in $(seq 1 24); do
            if curl --fail --silent --max-time 20 "$BACKEND_URL/api/health" | grep -q '"database":"ok"'; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet, retrying in 10 s…"
            sleep 10
          done
          echo "::error::Backend did not report healthy at $BACKEND_URL/api/health"
          exit 1

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL is not set. See README → CI/CD."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Vercel deploy triggered for commit $GITHUB_SHA"

      - name: Smoke test the live site
        run: |
          sleep 45
          curl --fail --silent --show-error --max-time 30 "$FRONTEND_URL" | grep -qi '<div id="root"' \
            && echo "Frontend is serving the app."
          curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/api/portfolio" | grep -q '"members"' \
            && echo "Portfolio API responds."
